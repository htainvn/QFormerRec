# ---------------------------------------------------------------------------
# Stage 2 -- train the Q-Former CIE on the prompt that KEEPS the history titles.
#
# Trains: Q-Former, query generator, LLM projector, genre/cluster prototypes,
#         CoLLM's <UserID>/<TargetItemID> MLP (`freeze_proj: False`), LoRA, and
#         MF if `freeze_rec: False`.
# Frozen: Vicuna.
#
# Why LoRA is no longer frozen here: stage 1 teaches LoRA to read
# `tallrec_movie.txt`, which is pure text and whose ONLY evidence about the user
# is the rendered title list. This stage swaps in `qformer_movie.txt` --
# different wording, no titles, and six soft vectors (4 <PrefTokens> + <UserID>
# + <TargetItemID>) that stage-1 LoRA has never seen. Keeping the prompt short is
# the whole point of the method, so the mismatch cannot be removed from the
# prompt side; it has to be paid for by letting the reader adapt.
#
# Freezing LoRA on top of that swap is what broke the previous run. A frozen
# reader cannot learn a new token type, so no usable gradient reached the
# Q-Former: `loss_cf` sat at ~0.60 for 21 epochs while `loss_bce` fell
# 0.61 -> 0.14 through the one shortcut left open (`llama_proj` on the frozen
# MF). Best valid uauc landed at epoch 0 -- 50 steps, i.e. the stage-1/MF
# baseline -- and every later epoch was worse.
#
# So this stage is really "relearn the task on the new prompt, jointly with the
# Q-Former, initialised from stage-1 LoRA". It needs a stage-1-sized LoRA lr and
# a stage-1-sized step budget, not a light touch-up.
#
# During the hyper-parameter search keep `freeze_rec: True` (CoLLM's Omega = phi):
# tuning the collaborative model needs >=5x the training effort on ML-1M. Unfreeze
# it only for the final runs.
# ---------------------------------------------------------------------------
model:
  arch: mini_gpt4rec_qformer
  model_type: pretrain_vicuna
  freeze_rec: True            # False for the final runs (T2-style tuning)
  freeze_proj: False          # the <UserID>/<TargetItemID> mapping trains here
  # LoRA must train here. It is the only module that can learn to *read*
  # <PrefTokens>; freezing it is what starved the Q-Former. Held at lr/10 via
  # `lr_scale.lora` so it drifts off the stage-1 solution slowly.
  freeze_lora: False
  max_txt_len: 1024
  proj_token_num: 1
  proj_drop: 0
  # llama_proj is nn.Sequential(Linear, ReLU, Linear) with its Dropout commented out in
  # CoLLM, and at proj_mid_times=10 it is 11.15M params -- 79% of everything trainable
  # here, 417 params per training row, with no dropout on it. That is the surface that
  # overfits ML-1M's 33 891 rows within ~100 steps. 2 cuts it to 2.23M (5x).
  # MUST match between stage 2 and stage 3, or the stage-2 checkpoint will not load.
  proj_mid_times: 2
  end_sym: "###"
  # The short prompt is the design: history lives in the memory slots, which cost
  # zero prompt tokens, so k_hist can be 50 instead of the 10 titles CoLLM can
  # afford to render. Keeping <ItemTitleList> here would undo the contribution.
  # The cost is that stage 1's LoRA has no familiar ground to stand on -- see the
  # LoRA lr note in `lr_scale` below, which is what pays for it.
  # `qformer_movie_titles.txt` is the `+titles` control, for debugging only.
  prompt_path: "prompts/qformer_movie.txt"
  prompt_template: '{}'
  llama_model: /content/vicuna-7b-v0
  user_num: -100
  item_num: -100
  ans_type: 'v2'
  rec_model: "MF"
  n_titles_kept: 0            # set to 3 for the `+titles` fallback/ablation
  diag_log_freq: 200          # steps between anti-collapse diagnostic dumps

  ckpt_lora: /content/logs/stage1_ml1m/checkpoint_best.pth   # cached stage 1
  # ckpt:  <stage-2 checkpoint>       # only for eval / resuming stage 3

  lora_config:
    use_lora: True
    r: 8
    alpha: 16
    target_modules: ["q_proj", "v_proj"]
    dropout: 0.05
  rec_config:
    user_num: -100
    item_num: -100
    embedding_size: 256
    pretrained_path: /content/ckpt/mf_ml1m_d256.pth

  qformer:
    d_q: 128
    n_query: 4                # L; ablate 1 / 2 / 4 / 8
    n_layers: 2
    n_heads: 4
    dropout: 0.1
    use_slot_prior: True
    use_candidate: True       # False = `-candidate` ablation (no FiLM)
    match_llm_norm: True      # False = `-norm-match` ablation
    memory:
      # History slots are per-row and point-in-time: the sample's own `his`
      # column, i.e. exactly what CoLLM renders into <ItemTitleList>. Nothing is
      # precomputed for them. `train_only` restores the old per-user train-split
      # lookup -- that is the `-pit-history` ablation row.
      history_source: pit         # pit | train_only
      # CoLLM caps history at 10 only because it renders it as TEXT; memory slots
      # cost zero prompt tokens, so this can go to 50 (<= pit_hist_width below).
      # ML-1M mean history: ~38 train / ~75 test. Search {10, 20, 50}.
      k_hist: 50
      k_neighbor: 8
      k_genre: 3
      k_cluster: 3
      memory_index_path: /content/ckpt/memory_index_ml1m.pkl
  loss:
    lambda_rank: 0.5
    lambda_cf: 0.2
    lambda_div: 0.1
    lambda_attn: 0.05
    lambda_var: 0.05
    lambda_align: 0.0
    rank_score: yes_minus_no  # s = logit(Yes) - logit(No) for L_rank

datasets:
  movie_ood_qf:
    path: /content/data/ml-1m/
    data_type: default
    pit_hist_width: 50          # width of the emitted history; must be >= k_hist
    # full valid (10 401 rows) instead of CoLLM's valid_small (5 200): UAUC selection
    # noise drops from SE 0.0168 to 0.0122. Costs ~2x eval time, reports nothing.
    valid_split: valid
    build_info:
      storage: /content/data/ml-1m/

run:
  task: rec_qformer
  runner: rec_runner_qformer
  lr_sched: "linear_warmup_cosine_lr_scaled"
  # 1e-3 (the spec's value) diverges here: the only healthy epoch was the one still
  # in warmup at ~2.6e-4 mean lr, after which token cosine spiked to 0.82 and both
  # UAUC and validation loss went the wrong way. See runsheet 5.3.
  # 3e-4 repeated the same pattern one notch down: warmup ended at step 400
  # (epoch 8), token_cosine_offdiag spiked to 0.45 exactly there, and the best
  # validation of the whole run was epoch 0 at ~4.6e-5 mean lr. Every validation
  # after warmup was worse than every validation during it, so 5e-5 is where the
  # evidence points.
  init_lr: 5e-5               # Q-Former / projector / prototypes
  min_lr: 5e-6                # must be << init_lr or the cosine never anneals
  warmup_lr: 1e-5
  mode: 'v2'
  select_metric: uauc
  # early stop after this many validations without a select_metric improvement.
  # Units are VALIDATIONS, so patience x iters_per_epoch steps. 0/null disables.
  patience: 20
  grad_clip: 1.0
  # Keep trainable params in fp32 while the frozen Vicuna stays fp16. Required with
  # amp: True -- peft >= 0.5 creates LoRA adapters in the base fp16 dtype, and
  # GradScaler refuses fp16 gradients. CoLLM's peft 0.4.0 pin gave fp32 adapters,
  # so this restores the precision it actually trained with.
  fp32_trainable: True

  lr_scale:                   # effective lr = init_lr * scale
    qformer: 1.0              # 5e-5
    # llama_proj is the shortcut that memorised the frozen MF embeddings and drove
    # train BCE to 0.14 while validation degraded. It cannot be frozen -- stage 1
    # never trained it (`freeze_proj: True` there), so freezing would leave
    # <UserID>/<TargetItemID> as random vectors -- but it must not outrun the
    # Q-Former either.
    proj: 0.1                 # 5e-6
    proto: 1.0                # 5e-5
    rec: 0.1                  # 5e-6  (only matters if freeze_rec: False)
    # Scale > 1 is fine -- the scheduler just multiplies. LoRA is NOT being
    # touched up here, it is relearning the task on a prompt whose evidence is
    # entirely soft tokens, so it needs the same lr stage 1 gave it. Stage 1:
    # init_lr 1e-4 x lora 1.0 = 1e-4, with the note "LoRA on a 7B wants ~1e-4".
    # 2.0 x 5e-5 reproduces that exactly. At the old 0.1 it would sit at 5e-6,
    # 20x too low to adapt to a new prompt at all.
    lora: 2.0                 # 1e-4  -- matches stage 1's proven LoRA lr

  user_grouped_sampler: True  # required by L_rank; False ablates it cleanly
  users_per_batch: 8          # U
  rows_per_user: 6            # m  -> real batch = 48, no grad accumulation
  strict_batch: True

  # raised from 1e-3: weight decay is the only regulariser that reaches llama_proj,
  # since model.qformer.dropout only applies to the Q-Former side (~21% of params)
  weight_decay: 1e-2
  # 160 set the cosine period over 8000 steps, but the run early-stopped at step
  # 1050, so the lr never annealed -- the model spent its whole post-warmup life
  # at peak lr. Size max_epoch to what the run actually reaches.
  # 80 x 50 x 48 = 192k rows, comparable to stage 1's 6000 x 32 = 192k, which is
  # the budget LoRA needed to learn this task the first time. Early stopping
  # (patience 20 = 1000 steps) ends it sooner if it plateaus.
  max_epoch: 80                # 80 x 50 iters x 48 rows = 4000 steps
  # Validation cadence. The metric peaks INSIDE the first 200 steps on ML-1M,
  # so 200+ is too coarse to checkpoint the peak. Finer + early stopping is
  # cheaper overall, because the run ends as soon as it plateaus.
  iters_per_epoch: 50
  batch_size_train: 48        # ignored while user_grouped_sampler is on
  batch_size_eval: 64
  num_workers: 4
  # was 400 = 8 epochs, i.e. most of the run's useful life was spent ramping.
  warmup_steps: 200           # 5% of 4000 total iters
  empty_cache_freq: 0

  seed: 42
  output_dir: /content/logs/stage2_ml1m

  amp: True
  resume_ckpt_path: null

  evaluate: False
  train_splits: ["train"]
  valid_splits: ["valid"]
  test_splits: ["test", "valid"]

  device: "cuda"
  world_size: 1
  dist_url: "env://"
  distributed: False
