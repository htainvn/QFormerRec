# ---------------------------------------------------------------------------
# Stage 1 -- LoRA warmup on the TALLRec (text-only) prompt.
#
# This is CoLLM's stage 1, unchanged: the long prompt WITH history titles, the
# legacy `mini_gpt4rec_v2` arch, LoRA trainable, everything else frozen. Its job
# is to teach the LLM the recommendation task and to preserve cold-start ability
# from text semantics; stripping the titles here would leave stage 1 with almost
# no user signal.
#
# The resulting checkpoint does NOT depend on any Q-Former hyper-parameter, so
# train it ONCE per dataset and point every stage-2 run at it via `ckpt_lora`.
# You can also drop in CoLLM's published stage-1 checkpoint instead.
# ---------------------------------------------------------------------------
model:
  arch: mini_gpt4rec_v2
  model_type: pretrain_vicuna
  freeze_rec: True
  freeze_proj: True          # no ID tokens in this prompt
  freeze_lora: False         # <-- the only thing that trains
  max_txt_len: 1024
  proj_token_num: 1
  proj_drop: 0
  proj_mid_times: 10
  end_sym: "###"
  prompt_path: "prompts/tallrec_movie.txt"
  prompt_template: '{}'
  llama_model: /content/vicuna-7b-v0
  user_num: -100
  item_num: -100
  ans_type: 'v2'
  rec_model: "MF"
  lora_config:
    use_lora: True
    r: 8
    alpha: 16
    target_modules: ["q_proj", "v_proj"]
    dropout: 0.05
  rec_config:
    user_num: -100
    item_num: -100
    embedding_size: 256
    pretrained_path: /content/ckpt/mf_ml1m_d256.pth

datasets:
  movie_ood_qf:
    path: /content/data/ml-1m/
    data_type: default
    build_info:
      storage: /content/data/ml-1m/

run:
  task: rec_qformer
  runner: rec_runner_qformer
  lr_sched: "linear_warmup_cosine_lr_scaled"
  # LoRA on a 7B wants ~1e-4, not the 1e-3 CoLLM uses for its CIE stage. At 1e-3 the
  # run peaks around the end of warmup and then decays back to chance -- see runsheet 5.1.
  init_lr: 1e-4
  min_lr: 1e-5
  warmup_lr: 1e-6
  mode: 'v2'
  select_metric: uauc
  # early stop after this many validations without a select_metric improvement.
  # Units are VALIDATIONS, so patience x iters_per_epoch steps. 0/null disables.
  patience: 20          # checkpoint on validation UAUC, not AUC
  grad_clip: 1.0
  # Keep trainable params in fp32 while the frozen Vicuna stays fp16. Required with
  # amp: True -- peft >= 0.5 creates LoRA adapters in the base fp16 dtype, and
  # GradScaler refuses fp16 gradients. CoLLM's peft 0.4.0 pin gave fp32 adapters,
  # so this restores the precision it actually trained with.
  fp32_trainable: True

  lr_scale:                    # stage 1 tunes LoRA at the full init_lr
    lora: 1.0
    qformer: 1.0
    proto: 1.0
    rec: 0.1

  user_grouped_sampler: False   # keep stage 1 identical to CoLLM's stage 1
  weight_decay: 1e-3
  max_epoch: 60                 # 60 x 100 iters x bs32 ~ 5.7 real epochs
  iters_per_epoch: 100
  batch_size_train: 32
  batch_size_eval: 64
  num_workers: 4
  warmup_steps: 300             # ~5% of 6000 total iters

  seed: 42
  output_dir: /content/logs/stage1_ml1m

  amp: True
  resume_ckpt_path: null

  evaluate: False
  train_splits: ["train"]
  valid_splits: ["valid"]
  test_splits: ["test", "valid"]

  device: "cuda"
  world_size: 1
  dist_url: "env://"
  distributed: False
