# ---------------------------------------------------------------------------
# Stage 3 -- T2-style MF tuning at the stage-2 lr (see the init_lr note below).
#
# Mirrors CoLLM's T1/T2 tuning, which is where its best numbers came from -- do
# not skip it. Start from the stage-2 best checkpoint (`ckpt`) AND the stage-1
# LoRA weights (`ckpt_lora`), since the stage-2 checkpoint only stores the
# parameters that were trainable in stage 2.
#
# What this stage is for: LoRA moved up to stage 2 (freezing it there is what
# starved the Q-Former; see the stage-2 header), so `freeze_rec: False` is now
# the one thing stage 3 does that stage 2 does not. That also makes the
# "stage-3 off" ablation in runsheet 6.3 meaningful -- it measures exactly what
# tuning the collaborative model buys. AUC is the metric to watch here: nothing
# in the loss optimises it directly, and closing the gap to CoLLM-MF T2 (0.7418
# test) is what unfreezing MF is for.
#
# Why the prompt keeps <TargetItemID>: with the `_prefonly` prompt this stage did
# nothing at all -- 400 steps with MF at 1e-4 moved train loss_bce by 0.00 and
# cost 0.033 uauc. MF only reached the LLM through the memory bank, i.e. through a
# weighted average over 65 slots pooled into 4 tokens, so its gradient arrived
# diluted to nothing. CoLLM's T2 gets +0.094 test AUC from MF tuning precisely
# because <UserID>/<TargetItemID> feed MF into the LLM directly. Keeping the item
# id restores that path on the side that does not memorise.
#
# PRECONDITION -- stage 3 inherits whatever stage 2 produced. The previous
# collapse here was not independent: stage 2's `checkpoint_best.pth` was its
# epoch 0, so stage 3 initialised from a Q-Former that had never trained. Check
# that stage 2's best epoch is NOT epoch 0 and that its valid auc beat the
# stage-1 baseline (~0.687 on ML-1M) before spending a run here.
# ---------------------------------------------------------------------------
model:
  arch: mini_gpt4rec_qformer
  model_type: pretrain_vicuna
  # T2-style tuning, and the ONE thing that distinguishes this stage from stage 2.
  # Held back until here on purpose: MF is a 1.05M lookup table (839 users + 3256
  # items x 256) serving the 740 users that appear in training at ~46 rows each --
  # the same memorisation shape that <UserID> had. Stage 2 must be stable before
  # it opens. Expect `'rec': 1048320` in the `by group` line.
  freeze_rec: False
  freeze_proj: False          # MUST match stage 2 -- <TargetItemID> is spliced
  freeze_lora: False          # trains in stage 2 too, just slower here
  max_txt_len: 1024
  proj_token_num: 1
  proj_drop: 0
  # llama_proj is nn.Sequential(Linear, ReLU, Linear) with its Dropout commented out in
  # CoLLM, and at proj_mid_times=10 it is 11.15M params -- 79% of everything trainable
  # here, 417 params per training row, with no dropout on it. That is the surface that
  # overfits ML-1M's 33 891 rows within ~100 steps. 2 cuts it to 2.23M (5x).
  # MUST match between stage 2 and stage 3, or the stage-2 checkpoint will not load.
  proj_mid_times: 2
  end_sym: "###"
  # MUST match stage 2 -- a prompt swap between stages is exactly the mismatch
  # that broke the stage-1 -> stage-2 hand-off.
  prompt_path: "prompts/qformer_movie_prefitem.txt"
  prompt_template: '{}'
  llama_model: /content/vicuna-7b-v0
  user_num: -100
  item_num: -100
  ans_type: 'v2'
  rec_model: "MF"
  n_titles_kept: 0            # MUST match stage 2
  diag_log_freq: 200          # steps between anti-collapse diagnostic dumps

  ckpt_lora: /content/logs/stage1_ml1m/checkpoint_best.pth   # cached stage 1
  ckpt: /content/logs/stage2_ml1m/checkpoint_best.pth        # stage-2 best

  lora_config:
    use_lora: True
    r: 8
    alpha: 16
    target_modules: ["q_proj", "v_proj"]
    dropout: 0.05
  rec_config:
    user_num: -100
    item_num: -100
    embedding_size: 256
    pretrained_path: /content/ckpt/mf_ml1m_d256.pth

  qformer:
    d_q: 128
    n_query: 4                # L; ablate 1 / 2 / 4 / 8
    n_layers: 2
    n_heads: 4
    dropout: 0.1
    use_slot_prior: True
    use_candidate: True       # False = `-candidate` ablation (no FiLM)
    match_llm_norm: True      # False = `-norm-match` ablation
    memory:
      # History slots are per-row and point-in-time: the sample's own `his`
      # column, i.e. exactly what CoLLM renders into <ItemTitleList>. Nothing is
      # precomputed for them. `train_only` restores the old per-user train-split
      # lookup -- that is the `-pit-history` ablation row.
      history_source: pit         # pit | train_only
      # CoLLM caps history at 10 only because it renders it as TEXT; memory slots
      # cost zero prompt tokens, so this can go to 50 (<= pit_hist_width below).
      # ML-1M mean history: ~38 train / ~75 test. Search {10, 20, 50}.
      k_hist: 50
      k_neighbor: 8
      k_genre: 3
      k_cluster: 3
      # Title semantics on the history slots. False reproduces every run before
      # 2026-08-11 exactly. Needs a memory index built with --llm_path.
      use_title: False
      memory_index_path: /content/ckpt/memory_index_ml1m.pkl
  loss:
    lambda_rank: 0.5
    lambda_cf: 0.2
    lambda_div: 0.1
    lambda_attn: 0.15           # MUST match stage 2 -- see its note
    lambda_var: 0.05
    lambda_align: 0.0
    rank_score: yes_minus_no  # s = logit(Yes) - logit(No) for L_rank

datasets:
  movie_ood_qf:
    path: /content/data/ml-1m/
    data_type: default
    pit_hist_width: 50          # width of the emitted history; must be >= k_hist
    # full valid (10 401 rows) instead of CoLLM's valid_small (5 200): UAUC selection
    # noise drops from SE 0.0168 to 0.0122. Costs ~2x eval time, reports nothing.
    valid_split: valid
    build_info:
      storage: /content/data/ml-1m/

run:
  task: rec_qformer
  runner: rec_runner_qformer
  lr_sched: "linear_warmup_cosine_lr_scaled"
  # NOT stage-2/10 any more. That convention assumes stage 2 ends mid-descent so
  # stage 3 has something to anneal; stage 2 now ends FLAT (train ~= valid ~= 0.65,
  # both static), so dividing by 10 produced a run where nothing moved at all --
  # `proj_scale` sat at 0.0203 for the entire run, train loss went 0.644 -> 0.634,
  # AUC 0.6945 -> 0.6972. The experiment did not fail, it never ran.
  # MF is the thing this stage exists to tune and it was pretrained at lr 1e-3
  # (scripts/pretrain_mf.py) over 5000 epochs at batch 2048. `rec: 2.0` x 5e-5 puts
  # it at 1e-4 = 1/10 of that, which can actually move a 1.05M table.
  init_lr: 5e-5
  min_lr: 5e-6
  warmup_lr: 1e-6
  mode: 'v2'
  select_metric: uauc
  # early stop after this many validations without a select_metric improvement.
  # Units are VALIDATIONS, so patience x iters_per_epoch steps. 0/null disables.
  patience: 20
  grad_clip: 1.0
  # Keep trainable params in fp32 while the frozen Vicuna stays fp16. Required with
  # amp: True -- peft >= 0.5 creates LoRA adapters in the base fp16 dtype, and
  # GradScaler refuses fp16 gradients. CoLLM's peft 0.4.0 pin gave fp32 adapters,
  # so this restores the precision it actually trained with.
  fp32_trainable: True

  lr_scale:                   # effective lr = init_lr * scale
    qformer: 1.0              # 5e-5
    proj: 0.1                 # 5e-7  -- same shortcut throttle as stage 2
    proto: 1.0                # 5e-6
    # MF was pretrained at lr 1e-3 (scripts/pretrain_mf.py). At the old 0.1 this
    # would be 5e-7 -- 2000x below that, i.e. frozen in all but name, and the run
    # would look like "tuning MF does nothing" when it simply never moved.
    # 2.0 x 5e-6 = 1e-5 is 1/100 of the pretrain lr, a normal fine-tune ratio.
    rec: 2.0                  # 1e-4  -- 1/10 of MF's pretrain lr
    lora: 2.0                 # 1e-4  -- same as stage 2

  user_grouped_sampler: True  # required by L_rank; False ablates it cleanly
  users_per_batch: 8          # U
  rows_per_user: 6            # m  -> real batch = 48, no grad accumulation
  strict_batch: True

  # raised from 1e-3: weight decay is the only regulariser that reaches llama_proj,
  # since model.qformer.dropout only applies to the Q-Former side (~21% of params)
  weight_decay: 1e-2
  # Same 1600 steps as before, but 32 validations instead of 8. Stage 2 peaked at
  # step 250, so a 200-step grid would step straight over the peak and checkpoint
  # something worse.
  max_epoch: 80               # 80 x 50 iters x 48 rows = 4000 steps
  iters_per_epoch: 50
  batch_size_train: 48        # ignored while user_grouped_sampler is on
  batch_size_eval: 64
  num_workers: 4
  warmup_steps: 200           # 5% of 4000 total iters
  empty_cache_freq: 0

  seed: 42
  output_dir: /content/logs/stage3_ml1m

  amp: True
  resume_ckpt_path: null

  evaluate: False
  train_splits: ["train"]
  valid_splits: ["valid"]
  test_splits: ["test", "valid"]

  device: "cuda"
  world_size: 1
  dist_url: "env://"
  distributed: False
